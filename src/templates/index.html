<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>半导体产线智能质量预警系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">半导体产线智能质量预警系统</h1>
        
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">服务状态</h5>
                <p class="text-success">✅ 后端服务运行正常</p>
                <p>数据库连接正常，API接口可用</p>
                <a href="/api/batch/list" class="btn btn-primary" target="_blank">查看批次列表</a>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <h5 class="card-title">模型训练</h5>
                <button id="trainBtn" class="btn btn-success">一键训练模型</button>
                <div id="trainResult" class="mt-3"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('trainBtn').addEventListener('click', function(){
            fetch('/api/model/train', {method: 'POST'})
            .then(res => res.json())
            .then(data => {
                document.getElementById('trainResult').innerHTML = 
                    '<div class="alert alert-success">训练完成！<br>准确率：' + data.data.quality_predict.accuracy.toFixed(4) + 
                    '<br>召回率：' + data.data.quality_predict.recall.toFixed(4) + '</div>';
            })
            .catch(err => {
                document.getElementById('trainResult').innerHTML = 
                    '<div class="alert alert-danger">训练失败：' + err.message + '</div>';
            });
        });
    </script>
</body>
</html>
<div class="card-body">
    <h5 class="card-title">服务状态</h5>
    <p class="text-success">✅ 后端服务运行正常</p>
    <p>数据库连接正常，API接口可用</p>
    <div class="d-grid gap-2">
        <a href="/batch/list" class="btn btn-primary">进入批次管理</a>
        <a href="/api/batch/list" class="btn btn-outline-primary" target="_blank">查看批次数据接口</a>
    </div>
</div>
