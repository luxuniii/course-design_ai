<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>批次列表 - 半导体产线智能质量预警系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>生产批次列表</h2>
            <a href="/" class="btn btn-outline-secondary">返回首页</a>
        </div>

        <div class="card">
            <div class="card-body">
                <table class="table table-hover table-bordered">
                    <thead class="table-light">
                        <tr>
                            <th>批次ID</th>
                            <th>批次编号</th>
                            <th>质量结果</th>
                            <th>数据集划分</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="batchTable">
                        <tr><td colspan="5" class="text-center">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 页面加载时获取批次列表
        window.onload = function() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/batch/list', true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var res = JSON.parse(xhr.responseText);
                    renderTable(res.data);
                }
            };
            xhr.send();
        };

        function renderTable(data) {
            var html = '';
            for (var i = 0; i < data.length; i++) {
                var item = data[i];
                var resultTag = item.final_result === 0 
                    ? '<span class="badge bg-success">合格</span>' 
                    : '<span class="badge bg-danger">失效</span>';
                
                html += '<tr>' +
                    '<td>' + item.batch_id + '</td>' +
                    '<td>' + item.batch_code + '</td>' +
                    '<td>' + resultTag + '</td>' +
                    '<td>' + item.split_type + '</td>' +
                    '<td><a href="/batch/' + item.batch_id + '" class="btn btn-sm btn-primary">查看详情</a></td>' +
                '</tr>';
            }
            document.getElementById('batchTable').innerHTML = html;
        }
    </script>
</body>
</html>
